# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code Scanning

on:
  workflow_call:
    inputs:
      go-version-file:
        type: string
        description: |
          The path to the go version file.
          Default: go.mod
        default: go.mod
        required: false

permissions:
  # for github/codeql-action/init to get workflow details
  actions: read

  # for github/codeql-action/analyze to upload SARIF results
  security-events: write

jobs:
  build:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{inputs.go-version-file}}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: go
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.3
